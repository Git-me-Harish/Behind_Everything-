name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: e2e (ubuntu, ${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      # Headless Firefox on Linux has no GL at all, so it would (correctly) fall back to the 2D board. Run it
      # headed on a virtual display with Mesa's software OpenGL so the 3D map itself is tested.
      - if: matrix.browser == 'firefox'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libegl1
      - run: ${{ matrix.browser == 'firefox' && 'xvfb-run -a ' || '' }}pnpm test:e2e
        env:
          PW_BROWSER: ${{ matrix.browser }}
          PW_HEADED: ${{ matrix.browser == 'firefox' && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  site:
    name: site (ubuntu, ${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm site:build
      - run: pnpm test:site
        env:
          PW_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: site-report-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  package:
    name: package (npx from the packed tarball)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      # What a new user runs, from an empty folder: the server must come up and serve the app.
      - name: npx behind-everything
        run: |
          cd "$(mktemp -d)"
          mkdir -p logs/claude logs/codex logs/copilot data
          CLAUDE_CONFIG_DIR=$PWD/logs/claude CODEX_HOME=$PWD/logs/codex COPILOT_HOME=$PWD/logs/copilot BE_HOME=$PWD/data \
            npx --yes --package "$(ls "$RUNNER_TEMP"/behind-everything-*.tgz)" behind-everything --port 47977 --no-open --quiet &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:47977/api/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:47977/api/health
          curl -sf http://127.0.0.1:47977/ | grep -q '<title>Behind Everything</title>'
          npx --yes --package "$(ls "$RUNNER_TEMP"/behind-everything-*.tgz)" behind-everything hooks --help | grep -q 'hooks install'
